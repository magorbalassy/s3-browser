[project]
name = "s3-browser"
version = "0.2.0"
description = "Browse S3-compatible storage and calculate folder sizes on demand."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "fastapi>=0.115",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
s3-browser = "s3_browser.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "moto[s3]>=5.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["s3_browser"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["s3-browser.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
