<mat-toolbar>
  <a class="brand" routerLink="/">
    <mat-icon>cloud</mat-icon>
    <span>S3 Browser</span>
  </a>

  @if (store.sources().length) {
    <mat-form-field class="picker source-select" subscriptSizing="dynamic">
      <mat-icon matPrefix>storage</mat-icon>
      <mat-select
        placeholder="Select a source"
        aria-label="Source"
        [value]="sourceId()"
        (selectionChange)="openSource($event.value)"
      >
        @for (s of store.sources(); track s.id) {
          <mat-option [value]="s.id">{{ s.name }}</mat-option>
        }
        <mat-divider />
        <mat-option [value]="manage">
          <mat-icon>settings</mat-icon>
          Manage sources…
        </mat-option>
      </mat-select>
    </mat-form-field>
  }

  @if (tls(); as t) {
    <span
      class="endpoint"
      [class.insecure]="t.insecure"
      [matTooltip]="t.tooltip"
      [attr.aria-label]="t.tooltip"
      tabindex="0"
    >
      <mat-icon>{{ t.icon }}</mat-icon>
    </span>
  }

  @if (sourceId()) {
    <mat-form-field class="picker bucket-select" subscriptSizing="dynamic">
      <mat-icon matPrefix>deployed_code</mat-icon>
      <mat-select
        placeholder="Select a bucket"
        aria-label="Bucket"
        [value]="bucket()"
        (selectionChange)="openBucket($event.value)"
      >
        @for (name of buckets(); track name) {
          <mat-option [value]="name">{{ name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  }

  <span class="spacer"></span>

  <a mat-icon-button routerLink="/sources" matTooltip="Sources" aria-label="Sources">
    <mat-icon>settings</mat-icon>
  </a>
  <button
    mat-icon-button
    (click)="theme.cycle()"
    [matTooltip]="themeLabel()"
    [attr.aria-label]="themeLabel()"
  >
    <mat-icon>{{ theme.icon() }}</mat-icon>
  </button>
</mat-toolbar>
